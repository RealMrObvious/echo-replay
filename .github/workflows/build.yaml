name: Build Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Read version from version.yaml
        shell: pwsh
        run: |
          $versionFile = "version.yaml"
          $yaml = Get-Content $versionFile

          $major = ($yaml | Select-String '^major:').ToString().Split(':', 2)[1].Trim()
          $minor = ($yaml | Select-String '^minor:').ToString().Split(':', 2)[1].Trim()
          $patch = ($yaml | Select-String '^patch:').ToString().Split(':', 2)[1].Trim()

          $match = $yaml | Select-String '^name:'
          $name = if ($match) { $match.ToString().Split(':', 2)[1].Trim() } else { "" }

          if ([string]::IsNullOrWhiteSpace($name)) {
              $version = "$major.$minor.$patch"
          } else {
              $version = "$major.$minor.$patch.$name"
          }

          Write-Host "Building Echo_Replay version $version"

          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed `
            --name Echo_Replay `
            --hidden-import pystray `
            --hidden-import PIL `
            --hidden-import playsound `
            --add-data "media;media" `
            --add-data "config.json;." `
            --icon "media/icon.ico" `
            src\main.py

      - name: Build Installer
        shell: pwsh
        run: |
          iscc "/DAppVersion=$env:APP_VERSION" "installer.iss"

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: v${{ env.APP_VERSION }}
          prerelease: ${{ contains(env.APP_VERSION, '.alpha') || contains(env.APP_VERSION, '.beta') || contains(env.APP_VERSION, '.rc') }}
          files: |
            installer/Echo_Replay_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}